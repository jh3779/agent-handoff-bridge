[package]
# Stays "app" deliberately, not a leftover: this is the actual compiled
# executable name Tauri/Rust link into the shipped bundle (see
# Contents/MacOS/app in the .app, matched by codesign/spctl output recorded
# in .handoff/current.md's v0.4.1 entry). Renaming it changes the real
# executable filename on all 3 platforms and would need a full CI
# installer-build re-verification, not just a cosmetic edit -- out of scope
# for this metadata-hygiene pass (audit finding F8, 2026-09-02).
name = "app"
version = "0.4.3"
description = "Agent Handoff Bridge desktop shell -- Tauri wrapper around handoff_webui.py for the Codex/Claude/Gemini CLI handoff bridge"
authors = ["jh3779"]
license = "UNLICENSED"
repository = "https://github.com/jh3779/agent-handoff-bridge"
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
# tauri::generate_context!() expands to code that references serde_json
# directly by crate name -- required even though no source file in this
# crate calls serde_json:: itself (verified: cargo check fails with
# "cannot find `serde_json` in the crate root" without this). Plain
# `serde` (the derive crate) has no such hidden requirement and was
# genuinely unused -- removed.
serde_json = "1.0"
log = "0.4"
tauri = { version = "2.11.3", features = [] }
tauri-plugin-log = "2"
tauri-plugin-shell = "2.3.5"
tauri-plugin-dialog = "2.7.2"
# DEC-28: real self-update, superseding DEC-22's "keep gh-CLI-based
# check_for_update() only, don't adopt Tauri's official updater" -- that
# call was made while this repo was private, when Tauri's updater had no
# documented private-repo support path. The repo has been public since
# v0.2.0; the premise DEC-22 rested on no longer holds. See
# docs/design-system/flutter-mapping.html's DEC-28 for the full record.
tauri-plugin-updater = "2"
# Without this, a second launch attempt (double-clicking the Dock/Finder
# icon while the app is already running -- closing its window on macOS
# doesn't quit the process, standard convention this app follows too)
# spawns a second sidecar that loses the port 8787 bind race against the
# first, surfacing as a real, confusing "port already in use, quit and
# try again" dialog to a user who has no idea an instance is already
# running (2026-09-02, hit in practice). This plugin instead redirects a
# second launch to focus the existing window.
tauri-plugin-single-instance = "2"
