name: TEMP - Generate Updater Signing Key
# One-off, throwaway workflow -- never merged to main, deleted from this
# branch immediately after use. Generates a real Tauri updater signing
# keypair via the official `tauri signer generate` command (needs a Rust
# toolchain this local dev machine doesn't have) and hands the private
# key back encrypted, so it's never visible in plain text in any log or
# public artifact listing. See docs/release-process.md's signing-key
# section (DEC-28) for the full, permanent record of how this key was
# created and how to rotate it later.

on:
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: dtolnay/rust-toolchain@stable
      - name: Install tauri-cli
        run: cargo install tauri-cli --version "2.11.4" --locked
      - name: Generate keypair (no password on the private key)
        run: cargo tauri signer generate --ci -w /tmp/updater.key
      - name: Print the public key (safe -- this half is meant to be public)
        run: cat /tmp/updater.key.pub
      - name: Encrypt the private key before it ever leaves this job
        env:
          TRANSPORT_PASSPHRASE: ${{ secrets.TEMP_TRANSPORT_PASSPHRASE }}
        run: |
          openssl enc -aes-256-cbc -pbkdf2 -salt \
            -in /tmp/updater.key -out /tmp/updater.key.enc \
            -pass env:TRANSPORT_PASSPHRASE
      - uses: actions/upload-artifact@v4
        with:
          name: encrypted-private-key
          path: /tmp/updater.key.enc
          retention-days: 1
