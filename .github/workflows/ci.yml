name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Phase 7b M3: installer-build below is manual-only (see its own comment
  # for why) -- workflow_dispatch is what lets a human actually trigger it.
  workflow_dispatch:

jobs:
  branch-name:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Check branch naming convention
        # github.head_ref is attacker-controlled (a PR author names their own
        # branch) and GitHub's ${{ }} template expansion happens before bash
        # parses this line -- interpolating it directly into `run:` would let
        # a branch name containing shell metacharacters ($(), ;, |, backticks,
        # all legal in a git ref) execute arbitrary commands on the runner.
        # Routing it through env: makes it reach the script as an inert
        # argv value instead.
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: python3 scripts/check_branch_name.py "$HEAD_REF"

  validate:
    # Review-bot finding on PR #14: workflow_dispatch (added for
    # installer-build below) is a workflow-wide trigger -- without this
    # guard, a manual run meant only to test installer-build would also
    # re-run validate/rust-build/sidecar-build, working against the exact
    # cost-consciousness that motivated gating installer-build to manual-
    # only in the first place. branch-name already excludes non-pull_request
    # events via its own `if:`, so it needed no change.
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run the full no-token validation suite
        run: python3 handoff_bridge.py check

  # Phase 7a (DEC-22): a review round found this repo's new src-tauri/ Rust
  # code had zero automated verification -- not even "does it compile" --
  # unlike everything else this project ships. Compile-only (not `cargo
  # tauri build`/a real bundle, and not scripts/build_sidecars.py's
  # real PyInstaller binaries -- those are the sidecar-build job below,
  # added in 7b). Placeholder sidecar files are still required, though:
  # tauri-build's own build script validates every tauri.conf.json
  # `bundle.externalBin` path *exists* before it will compile at all --
  # found the hard way, by this exact job failing on its first real CI run
  # with "resource path ... doesn't exist" even though nothing here
  # attempts a real bundle. Empty placeholders are enough to satisfy that
  # check and prove the Rust source + tauri.conf.json config are both
  # sound; they are never what a real build/release would ship.
  rust-build:
    # Same workflow_dispatch exclusion as validate above, same reason.
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    # This job's very first real CI run hung indefinitely (13+ minutes,
    # never even reaching `cargo build`) on the apt-get step below --
    # ubuntu-latest images ship `needrestart`, which prompts interactively
    # ("which services should be restarted?") after installing packages
    # unless told not to, and that prompt just hangs forever with no
    # terminal attached to answer it. A hard ceiling here means any repeat
    # of this (or a genuinely new hang) fails loudly in ~10 minutes instead
    # of silently burning CI time.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install Tauri's Linux build prerequisites
        env:
          DEBIAN_FRONTEND: noninteractive
          NEEDRESTART_MODE: a
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Create placeholder sidecar binaries
        run: |
          mkdir -p src-tauri/binaries
          for name in agent-handoff-bridge-server agent-handoff-bridge-cli agent-handoff-bridge-validate agent-handoff-bridge-scan; do
            touch "src-tauri/binaries/${name}-x86_64-unknown-linux-gnu"
            chmod +x "src-tauri/binaries/${name}-x86_64-unknown-linux-gnu"
          done
      - name: cargo build (src-tauri)
        run: cargo build --manifest-path src-tauri/Cargo.toml

  # Phase 7b M1: real, per-OS sidecar builds. PyInstaller/Nuitka don't
  # cross-compile (docs/research-phase7-framework.md), so "cross-platform"
  # here means literally running scripts/build_sidecars.py once per OS,
  # not compiling for multiple targets from one runner. Each GitHub-hosted
  # runner's target triple is well-known and passed explicitly
  # (--target-triple) rather than asking `rustc -vV` for it -- this job is
  # fundamentally a Python/PyInstaller packaging step, not a Rust one, so
  # it has no other reason to need a Rust toolchain installed at all.
  # 10-minute timeout for the same reason rust-build has one: this
  # project's one real CI hang so far was an apt-get/needrestart prompt,
  # not this job specifically, but the lesson (fail loudly, not silently)
  # applies here too.
  sidecar-build:
    # Same workflow_dispatch exclusion as validate/rust-build above, same
    # reason.
    if: github.event_name != 'workflow_dispatch'
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target-triple: aarch64-apple-darwin
            expected-runner-os: macOS
            expected-runner-arch: ARM64
          - os: windows-latest
            target-triple: x86_64-pc-windows-msvc
            expected-runner-os: Windows
            expected-runner-arch: X64
          - os: ubuntu-latest
            target-triple: x86_64-unknown-linux-gnu
            expected-runner-os: Linux
            expected-runner-arch: X64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      # Review-bot finding on PR #13: matrix.target-triple is hardcoded per
      # OS label, but scripts/build_sidecars.py's rename_for_tauri() trusts
      # whatever triple it's given -- it never checks the PyInstaller
      # output's actual OS/arch. If GitHub ever changes what a runner label
      # (e.g. macos-latest) maps to, this job would still go green while
      # silently naming an ARM64 binary as if it were x86_64 (or vice
      # versa), producing an artifact Tauri can't actually run. runner.os/
      # runner.arch are GitHub's own ground truth for the machine actually
      # running this job, so compare against those before trusting the
      # hardcoded triple at all.
      - name: Verify runner OS/arch matches this leg's assumed target triple
        shell: bash
        run: |
          if [ "${{ runner.os }}" != "${{ matrix.expected-runner-os }}" ] || [ "${{ runner.arch }}" != "${{ matrix.expected-runner-arch }}" ]; then
            echo "runner.os/runner.arch is ${{ runner.os }}/${{ runner.arch }}, but ${{ matrix.target-triple }} assumes ${{ matrix.expected-runner-os }}/${{ matrix.expected-runner-arch }}."
            echo "GitHub changed what '${{ matrix.os }}' maps to -- update this matrix leg's target-triple (and expected-runner-os/arch) to match."
            exit 1
          fi
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install PyInstaller
        run: pip install pyinstaller
      - name: Build sidecars
        # `python`, not `python3` -- unlike branch-name/validate above
        # (ubuntu-latest only), this job also runs on windows-latest,
        # where actions/setup-python puts `python.exe` on PATH but not
        # reliably a `python3` alias.
        run: python scripts/build_sidecars.py --target-triple ${{ matrix.target-triple }}
      - name: Verify all 8 expected files exist (plain + target-triple-suffixed, x4 sidecars)
        shell: bash
        run: |
          suffix=""
          if [ "${{ matrix.os }}" = "windows-latest" ]; then suffix=".exe"; fi
          for name in agent-handoff-bridge-server agent-handoff-bridge-cli agent-handoff-bridge-validate agent-handoff-bridge-scan; do
            test -f "src-tauri/binaries/${name}${suffix}" || { echo "missing src-tauri/binaries/${name}${suffix}"; exit 1; }
            test -f "src-tauri/binaries/${name}-${{ matrix.target-triple }}${suffix}" || { echo "missing src-tauri/binaries/${name}-${{ matrix.target-triple }}${suffix}"; exit 1; }
          done
          echo "all 8 files present for ${{ matrix.os }}"
      # Review-bot finding on PR #13: file-existence alone doesn't prove the
      # binaries actually run -- a frozen import error, missing bundled
      # data, or (Windows-specific) a subtly wrong PyInstaller invocation
      # would still leave the right *filenames* on disk. Run each
      # triple-suffixed binary (the exact artifact this job ships) with a
      # flag argparse always handles before any real subcommand logic:
      # --version for the CLI (also proves BRIDGE_VERSION reads correctly
      # out of the frozen bundle), --help for the other three.
      - name: Smoke test built sidecars actually start and run
        shell: bash
        run: |
          suffix=""
          if [ "${{ matrix.os }}" = "windows-latest" ]; then suffix=".exe"; fi
          triple="${{ matrix.target-triple }}"
          "src-tauri/binaries/agent-handoff-bridge-server-${triple}${suffix}" --help
          "src-tauri/binaries/agent-handoff-bridge-cli-${triple}${suffix}" --version
          "src-tauri/binaries/agent-handoff-bridge-validate-${triple}${suffix}" --help
          "src-tauri/binaries/agent-handoff-bridge-scan-${triple}${suffix}" --help
      - uses: actions/upload-artifact@v4
        with:
          name: sidecars-${{ matrix.target-triple }}
          path: src-tauri/binaries/*-${{ matrix.target-triple }}*
          retention-days: 7

  # Phase 7b M3: real, per-OS installer builds (.dmg/.msi+nsis/.deb+
  # AppImage+rpm) via `cargo tauri build`, unlike rust-build's placeholder-
  # sidecar compile-only check -- this answers "does a genuine, installable
  # bundle actually come out the other end," which rust-build deliberately
  # never tried to answer (docs/design-system/roadmap.md's 7b plan item 3).
  # Manual trigger only (workflow_dispatch), NOT on every PR/push like
  # every other job in this file: a real bundle build is genuinely
  # expensive on GitHub's private-repo Actions minutes (macOS runners bill
  # at 10x, Windows at 2x), and this project doesn't need a fresh installer
  # on every commit -- only when actually verifying one. Needs real
  # sidecars built first (not rust-build's placeholders); bundling empty
  # placeholder files wouldn't prove anything real. Unsigned output only --
  # code signing is 7c, a separate decision gate per DEC-22.
  installer-build:
    if: github.event_name == 'workflow_dispatch'
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target-triple: aarch64-apple-darwin
            expected-runner-os: macOS
            expected-runner-arch: ARM64
          - os: windows-latest
            target-triple: x86_64-pc-windows-msvc
            expected-runner-os: Windows
            expected-runner-arch: X64
          - os: ubuntu-latest
            target-triple: x86_64-unknown-linux-gnu
            expected-runner-os: Linux
            expected-runner-arch: X64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      # Same guard as sidecar-build, same reason -- see that job's comment.
      - name: Verify runner OS/arch matches this leg's assumed target triple
        shell: bash
        run: |
          if [ "${{ runner.os }}" != "${{ matrix.expected-runner-os }}" ] || [ "${{ runner.arch }}" != "${{ matrix.expected-runner-arch }}" ]; then
            echo "runner.os/runner.arch is ${{ runner.os }}/${{ runner.arch }}, but ${{ matrix.target-triple }} assumes ${{ matrix.expected-runner-os }}/${{ matrix.expected-runner-arch }}."
            exit 1
          fi
      # Same prerequisites + noninteractive apt-get settings as rust-build,
      # for the same needrestart-hang reason. rust-build/sidecar-build never
      # actually exercise Tauri's Linux bundling code (rust-build only
      # compiles; sidecar-build only runs PyInstaller) -- this is the first
      # job that does, so it also needs `patchelf`/`xdg-utils`, which
      # Tauri's own official example CI bundling workflow installs and the
      # dev-prerequisites list above doesn't cover. (Tauri's rpm bundler
      # uses the pure-Rust `rpm` crate, not a system rpmbuild -- no rpm
      # package needed here, unlike an earlier version of this comment
      # assumed.) `libfuse2` works around a currently-open upstream bug
      # where the AppImage bundler's `linuxdeploy` fails on ubuntu-latest
      # specifically (tauri-apps/tauri#14796) -- if this job's AppImage
      # leg still fails after this, that issue is the first thing to check.
      # Review-bot finding on PR #14: if ubuntu-latest is on a 24.04-based
      # image, Ubuntu's 64-bit time_t transition may have renamed this
      # package to `libfuse2t64` -- installed separately with a fallback so
      # a name mismatch here doesn't hard-fail the whole prerequisites step
      # before reaching the packages that actually matter.
      - name: Install Tauri's Linux build prerequisites
        if: matrix.os == 'ubuntu-latest'
        env:
          DEBIAN_FRONTEND: noninteractive
          NEEDRESTART_MODE: a
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf xdg-utils
          sudo apt-get install -y libfuse2 || sudo apt-get install -y libfuse2t64 || echo "neither libfuse2 nor libfuse2t64 available -- AppImage bundling may fail, see tauri-apps/tauri#14796"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install PyInstaller
        run: pip install pyinstaller
      - name: Build sidecars (real binaries, not rust-build's placeholders)
        run: python scripts/build_sidecars.py --target-triple ${{ matrix.target-triple }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      # Pinned to the exact version this job's own local dry run used to
      # validate the whole pipeline (`^2` would let a later tauri-cli
      # release silently change bundler behavior between runs of this
      # manual-only job). `cargo install` compiles from source (no prebuilt
      # binary via this path) -- several minutes on every trigger, but this
      # job runs rarely by design (workflow_dispatch only), so that's an
      # accepted tradeoff over adding a second install mechanism
      # (cargo-binstall, a curl|bash script) just to save time here.
      - name: Install tauri-cli
        run: cargo install tauri-cli --version "2.11.4" --locked
      - name: cargo tauri build (real installer bundle)
        working-directory: src-tauri
        run: cargo tauri build
      - name: Verify expected installer artifacts were produced
        shell: bash
        run: |
          set -e
          case "${{ matrix.os }}" in
            macos-latest)
              find src-tauri/target/release/bundle/dmg -name '*.dmg' | grep -q . || { echo "no .dmg produced"; exit 1; }
              find src-tauri/target/release/bundle/macos -maxdepth 1 -name '*.app' | grep -q . || { echo "no .app produced"; exit 1; }
              ;;
            windows-latest)
              find src-tauri/target/release/bundle/msi -name '*.msi' | grep -q . || { echo "no .msi produced"; exit 1; }
              find src-tauri/target/release/bundle/nsis -name '*.exe' | grep -q . || { echo "no nsis .exe produced"; exit 1; }
              ;;
            ubuntu-latest)
              find src-tauri/target/release/bundle/deb -name '*.deb' | grep -q . || { echo "no .deb produced"; exit 1; }
              find src-tauri/target/release/bundle/appimage -name '*.AppImage' | grep -q . || { echo "no .AppImage produced"; exit 1; }
              find src-tauri/target/release/bundle/rpm -name '*.rpm' | grep -q . || { echo "no .rpm produced"; exit 1; }
              ;;
          esac
          echo "installer artifacts verified for ${{ matrix.os }}"
      - uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.target-triple }}
          path: |
            src-tauri/target/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/macos/*.app
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/rpm/*.rpm
          if-no-files-found: ignore
          retention-days: 7
