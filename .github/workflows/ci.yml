name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  branch-name:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Check branch naming convention
        run: python3 scripts/check_branch_name.py "${{ github.head_ref }}"

  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run the full no-token validation suite
        run: python3 handoff_bridge.py check
